name: Deploy Slidev to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create dist
        run: mkdir -p dist

      - name: Build Sesión 1
        run: |
          npx slidev build slides/subtema_1-1.md \
            --out ../dist/subtema_1-1 \
            --base /subtema_1-1/

      - name: Build Subtema 1.2
        run: |
          npx slidev build slides/subtema_1-2.md \
            --out ../dist/subtema_1-2 \
            --base /subtema_1-2/

      - name: Copy portal
        run: |
          cp public/index.html dist/index.html

          if [ -f public/CNAME ]; then
            cp public/CNAME dist/CNAME
          fi

      - name: Verify build
        run: |
          echo "=== ARCHIVOS GENERADOS ==="
          find dist -maxdepth 3 -type f | sort

          echo "=== VERIFICANDO PORTAL ==="
          test -f dist/index.html

          echo "=== VERIFICANDO SUBTEMA 1.1 ==="
          test -f dist/subtema_1-1/index.html

          echo "=== VERIFICANDO SUBTEMA 1.2 ==="
          test -f dist/subtema_1-2/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4