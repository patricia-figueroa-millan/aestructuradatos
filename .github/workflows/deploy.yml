name: Deploy Slidev to Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # 1. Crear carpeta dist y copiar el portal index.html
      - run: mkdir -p dist && cp public/index.html dist/index.html

      # 2. Compilar cada archivo md en su propia carpeta
      - run: npx slidev build slides/sesion-1.md --out dist/sesion-1 --base /sesion-1/
      # Descomenta la siguiente línea cuando agregues la sesión 2:
      # - run: npx slidev build slides/sesion-2.md --out dist/sesion-2 --base /sesion-2/

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - id: deployment
        uses: actions/deploy-pages@v4